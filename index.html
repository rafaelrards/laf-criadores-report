<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Monitoramento Criadores · 2026-09-04 · LAF</title><style>
:root {
--bg: #0b0d12;
--bg-elev: #12151c;
--bg-card: #171b24;
--bg-card-hover: #1d2230;
--border: #2a3142;
--border-soft: #222836;
--text: #e8ecf4;
--text-muted: #9aa3b5;
--text-dim: #6b7385;
--accent: #6ee7b7;
--accent-dim: rgba(110, 231, 183, 0.12);
--accent-2: #60a5fa;
--accent-2-dim: rgba(96, 165, 250, 0.12);
--warn: #fbbf24;
--warn-dim: rgba(251, 191, 36, 0.12);
--pink: #f472b6;
--pink-dim: rgba(244, 114, 182, 0.12);
--yt: #ff6b6b;
--x: #e8ecf4;
--ig: #e879f9;
--radius: 14px;
--radius-sm: 10px;
--shadow: 0 8px 32px rgba(0,0,0,0.35);
--max: 1100px;
--nav-h: 56px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 16px); }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
background: var(--bg);
color: var(--text);
line-height: 1.6;
font-size: 16px;
-webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
/* Sticky nav */
.nav {
position: sticky;
top: 0;
z-index: 100;
height: var(--nav-h);
background: rgba(11, 13, 18, 0.85);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border-bottom: 1px solid var(--border-soft);
}
.nav-inner {
max-width: var(--max);
margin: 0 auto;
padding: 0 20px;
height: 100%;
display: flex;
align-items: center;
gap: 8px;
overflow-x: auto;
scrollbar-width: none;
}
.nav-inner::-webkit-scrollbar { display: none; }
.nav-brand {
font-weight: 700;
font-size: 13px;
letter-spacing: 0.04em;
text-transform: uppercase;
color: var(--accent);
white-space: nowrap;
margin-right: 12px;
flex-shrink: 0;
}
.nav a {
color: var(--text-muted);
font-size: 13px;
padding: 6px 10px;
border-radius: 8px;
white-space: nowrap;
text-decoration: none;
transition: background 0.15s, color 0.15s;
}
.nav a:hover { background: var(--bg-card); color: var(--text); text-decoration: none; }
.wrap {
max-width: var(--max);
margin: 0 auto;
padding: 0 20px 80px;
}
/* Hero */
.hero {
padding: 56px 0 40px;
border-bottom: 1px solid var(--border-soft);
margin-bottom: 48px;
}
.badge {
display: inline-flex;
align-items: center;
gap: 8px;
font-size: 12px;
font-weight: 600;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--accent);
background: var(--accent-dim);
padding: 6px 12px;
border-radius: 999px;
margin-bottom: 20px;
}
.badge::before {
content: "";
width: 7px; height: 7px;
border-radius: 50%;
background: var(--accent);
box-shadow: 0 0 8px var(--accent);
}
.hero h1 {
font-size: clamp(1.85rem, 4.5vw, 2.75rem);
font-weight: 800;
letter-spacing: -0.03em;
line-height: 1.15;
margin-bottom: 16px;
}
.hero .lead {
font-size: 1.1rem;
color: var(--text-muted);
max-width: 640px;
margin-bottom: 24px;
}
.meta-row {
display: flex;
flex-wrap: wrap;
gap: 12px 24px;
font-size: 13px;
color: var(--text-dim);
}
.meta-row strong { color: var(--text-muted); font-weight: 600; }
/* Sections */
section { margin-bottom: 64px; }
.sec-head {
display: flex;
align-items: baseline;
gap: 12px;
margin-bottom: 8px;
flex-wrap: wrap;
}
.sec-num {
font-size: 12px;
font-weight: 700;
color: var(--accent);
letter-spacing: 0.08em;
}
h2 {
font-size: clamp(1.35rem, 2.5vw, 1.65rem);
font-weight: 750;
letter-spacing: -0.02em;
}
.sec-desc {
color: var(--text-muted);
margin-bottom: 28px;
max-width: 680px;
font-size: 0.95rem;
}
/* Cards grid */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) {
.grid-4 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
.grid-2, .grid-4 { grid-template-columns: 1fr; }
}
.card {
background: var(--bg-card);
border: 1px solid var(--border-soft);
border-radius: var(--radius);
padding: 20px;
transition: border-color 0.15s, background 0.15s;
}
.card:hover { border-color: var(--border); background: var(--bg-card-hover); }
/* Bio / profile */
.bio-card {
background: linear-gradient(145deg, var(--bg-card) 0%, #141a28 100%);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 28px;
display: grid;
gap: 20px;
}
.bio-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 14px;
}
.chip {
background: var(--bg-elev);
border: 1px solid var(--border-soft);
border-radius: var(--radius-sm);
padding: 12px 14px;
}
.chip label {
display: block;
font-size: 11px;
font-weight: 700;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--text-dim);
margin-bottom: 4px;
}
.chip span { font-size: 14px; color: var(--text); }
/* Dashboard metrics */
.metric {
text-align: left;
}
.metric .val {
font-size: 1.75rem;
font-weight: 800;
letter-spacing: -0.03em;
line-height: 1.2;
color: var(--text);
}
.metric .val.accent { color: var(--accent); }
.metric .val.blue { color: var(--accent-2); }
.metric .val.warn { color: var(--warn); }
.metric .val.pink { color: var(--pink); }
.metric .lbl {
font-size: 12px;
color: var(--text-dim);
margin-top: 4px;
text-transform: uppercase;
letter-spacing: 0.05em;
font-weight: 600;
}
.metric .sub {
font-size: 12px;
color: var(--text-muted);
margin-top: 6px;
}
/* Platform tags */
.tag {
display: inline-block;
font-size: 11px;
font-weight: 700;
letter-spacing: 0.05em;
text-transform: uppercase;
padding: 3px 8px;
border-radius: 6px;
}
.tag-yt { background: rgba(255,107,107,0.15); color: var(--yt); }
.tag-x { background: rgba(232,236,244,0.1); color: var(--x); }
.tag-ig { background: var(--pink-dim); color: var(--ig); }
.tag-pack { background: var(--accent-2-dim); color: var(--accent-2); }
.tag-long { background: var(--accent-dim); color: var(--accent); }
.tag-short { background: var(--warn-dim); color: var(--warn); }
/* YouTube video cards */
.yt-card {
background: var(--bg-card);
border: 1px solid var(--border-soft);
border-radius: var(--radius);
overflow: hidden;
margin-bottom: 24px;
}
.yt-embed {
position: relative;
padding-bottom: 56.25%;
height: 0;
background: #000;
}
.yt-embed iframe {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
border: 0;
}
.yt-body { padding: 20px 22px 24px; }
.yt-top {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 10px;
margin-bottom: 10px;
}
.yt-body h3 {
font-size: 1.15rem;
font-weight: 700;
letter-spacing: -0.015em;
margin-bottom: 8px;
line-height: 1.35;
}
.stats {
display: flex;
flex-wrap: wrap;
gap: 8px 16px;
font-size: 13px;
color: var(--text-muted);
margin-bottom: 14px;
}
.stats b { color: var(--text); font-weight: 600; }
.formula, .insight {
font-size: 14px;
padding: 12px 14px;
border-radius: var(--radius-sm);
margin-top: 10px;
}
.formula {
background: var(--accent-dim);
border-left: 3px solid var(--accent);
color: var(--text);
}
.insight {
background: var(--accent-2-dim);
border-left: 3px solid var(--accent-2);
color: var(--text-muted);
}
.formula strong, .insight strong {
display: block;
font-size: 11px;
letter-spacing: 0.06em;
text-transform: uppercase;
margin-bottom: 4px;
}
.formula strong { color: var(--accent); }
.insight strong { color: var(--accent-2); }
/* Link cards (X / IG) */
.link-card {
display: flex;
flex-direction: column;
gap: 12px;
height: 100%;
}
.link-card .handle {
font-size: 13px;
color: var(--text-muted);
}
.link-card h3 {
font-size: 1rem;
font-weight: 650;
line-height: 1.4;
letter-spacing: -0.01em;
}
.link-card .stats { margin-bottom: 0; }
.link-cta {
margin-top: auto;
display: inline-flex;
align-items: center;
gap: 6px;
font-size: 13px;
font-weight: 600;
color: var(--accent);
padding-top: 4px;
}
.link-cta:hover { text-decoration: none; opacity: 0.85; }
.link-cta::after { content: "→"; }
